name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: home-assistant/actions/hassfest@07f46fd2e19967768b5fd3000f91f857452b767c # master, 2026-11-22

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # brand images ship in custom_components/orgaia/brand (HA 2026.3+); no brands-repo entry yet
          ignore: brands

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      # A fixed Home Assistant (2026.10.4), so that a pull request is not red because Home Assistant moved on.
      # The weekly run in ha-versions.yml tests the newest, the beta and the oldest supported version.
      - run: pip install pytest-homeassistant-custom-component==0.13.375
      - run: pytest -q

  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: node --check custom_components/orgaia/www/orgaia-card.js
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node tests/card/smoke.mjs
